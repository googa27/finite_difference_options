name: Derivative validation broad matrix

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  broad-matrix:
    name: Greek derivative broad matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run broad derivative validation
        run: |
          python scripts/run_greek_derivative_validation.py \
            --mode broad \
            --output artifacts/fd-greek-derivative-validation-broad.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: finite-difference-options-greek-derivative-broad-matrix
          path: artifacts/fd-greek-derivative-validation-broad.json
          if-no-files-found: error
          retention-days: 30
